<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 24rem; margin: 3rem auto; padding: 0 1rem; color: #333; }
    h1 { margin: 0 0 1rem; }
    .messages { list-style: none; margin: 0 0 1rem; padding: 0; }
    .messages li { padding: 0.6rem 0.9rem; border-radius: 4px; margin-bottom: 0.5rem; background: #e8f0f4; border: 1px solid #b9cdd6; }
    .messages li.success { background: #e6f4ea; border-color: #b7dcc1; }
    .messages li.error { background: #fdecea; border-color: #f2b8b5; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.25rem; font-size: 0.9rem; color: #555; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 0.5rem 1.25rem; font-size: 1rem; cursor: pointer; }
    .errors { color: #b00020; margin: 0 0 1rem; }
    .back { margin-top: 1.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Log in</h1>

  {% if messages %}
    <ul class="messages" role="status">
      {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
    </ul>
  {% endif %}

  {% if form.errors %}
    <p class="errors" role="alert">Your username and password did not match. Please try again.</p>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <div class="field">
      <label for="{{ form.username.id_for_label }}">Username</label>
      {{ form.username }}
    </div>
    <div class="field">
      <label for="{{ form.password.id_for_label }}">Password</label>
      {{ form.password }}
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>

  <p class="back"><a href="{% url 'product_search' %}">View Site</a></p>
  <p class="back"><a href="{% url 'admin:login' %}">Admin Page</a></p>
</body>
</html>
